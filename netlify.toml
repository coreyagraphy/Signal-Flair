# Netlify build config — auto-applied when this repo is connected (Site → Import from Git).
# Signal Flair is a Next.js static export: `next build` emits ./out, which Netlify publishes
# directly. No SSR runtime / @netlify/plugin-nextjs needed (and it should NOT be added — this is
# a pure static site). The GA4 + GHL webhook env vars are set in the Netlify UI and inline at build.
[build]
  command = "next build"
  publish = "out"

[build.environment]
  NODE_VERSION = "20"

# /pulse — no such page has ever been built; the Signal Pulse™ CTA lives at the
# homepage intake form (#field-report), which is where every in-site Pulse button
# already points. Anyone arriving from outside marketing with /pulse used to hit a
# 404. 302 (not 301) on purpose: if a dedicated Pulse landing page is built later,
# search engines won't have cached this as permanent.
[[redirects]]
  from = "/pulse"
  to = "/#field-report"
  status = 302
  force = true

[[redirects]]
  from = "/pulse/"
  to = "/#field-report"
  status = 302
  force = true
