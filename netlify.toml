# Netlify build config — auto-applied when this repo is connected (Site → Import from Git).
# Signal Flair is a Next.js static export: `next build` emits ./out, which Netlify publishes
# directly. No SSR runtime / @netlify/plugin-nextjs needed (and it should NOT be added — this is
# a pure static site). The GA4 + GHL webhook env vars are set in the Netlify UI and inline at build.
[build]
  command = "next build"
  publish = "out"

[build.environment]
  NODE_VERSION = "20"

# Signal Pulse instant-preview serverless function (deterministic AI-readiness checks).
# Ships from ./netlify/functions. NOTE: a drag-and-drop deploy of out/ alone does NOT include
# functions — deploy with the CLI instead:  npm run build && npm run deploy
[functions]
  directory = "netlify/functions"
  node_bundler = "esbuild"

# Pretty alias for the function (the client also accepts the direct /.netlify/functions path).
[[redirects]]
  from = "/api/signal-pulse"
  to = "/.netlify/functions/signal-pulse"
  status = 200

# Old page route -> new short route (the page moved from /signal-pulse to /pulse)
[[redirects]]
  from = "/signal-pulse"
  to = "/pulse/"
  status = 301

[[redirects]]
  from = "/signal-pulse/*"
  to = "/pulse/"
  status = 301
