# Netlify build config — auto-applied when this repo is connected (Site → Import from Git).
# Signal Flair is a Next.js static export: `next build` emits ./out, which Netlify publishes
# directly. No SSR runtime / @netlify/plugin-nextjs needed (and it should NOT be added — this is
# a pure static site). The GA4 + GHL webhook env vars are set in the Netlify UI and inline at build.
[build]
  command = "next build"
  publish = "out"

[build.environment]
  NODE_VERSION = "20"

# Signal Pulse™ instant-preview serverless function (deterministic AI-readiness checks).
# Ships from ./netlify/functions alongside the static export — this is a Function, NOT the
# Next SSR runtime, so the "pure static site" rule above still holds.
[functions]
  directory = "netlify/functions"
  node_bundler = "esbuild"

# Pretty alias for the function (the client also accepts the direct /.netlify/functions path).
[[redirects]]
  from = "/api/signal-pulse"
  to = "/.netlify/functions/signal-pulse"
  status = 200

# Old page route -> current short route (the page moved from /signal-pulse to /pulse).
[[redirects]]
  from = "/signal-pulse"
  to = "/pulse/"
  status = 301

[[redirects]]
  from = "/signal-pulse/*"
  to = "/pulse/"
  status = 301

# Long-lived caching for heavy static media (compressed background videos rarely change).
[[headers]]
  for = "/video/*"
  [headers.values]
    Cache-Control = "public, max-age=86400, stale-while-revalidate=604800"
