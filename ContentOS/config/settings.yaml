# Content OS settings. Environment variables override these values.
# Secrets NEVER go here — use .env / real environment variables.

env: development
default_mode: review_required          # dry_run | review_required | trusted_format_autopilot
autopilot_min_score: 95
autopilot_approval_count: 5
distribution_dry_run: true

whisper_model: large-v3
whisper_device: cuda
whisper_compute_type: float16
whisper_language: en
whisper_cpu_fallback: true
transcription_adapter: auto            # auto | faster_whisper | fixture | energy

ollama_url: http://127.0.0.1:11434
ollama_model: qwen3:14b
llm_adapter: auto                      # auto | ollama | anthropic | template

# Conservative dead-air editing (milliseconds). See docs/03_MEDIA_PIPELINE.md.
minimum_removable_silence_ms: 1200
maximum_natural_pause_ms: 900
pre_cut_padding_ms: 150
post_cut_padding_ms: 200
minimum_clip_duration_ms: 800
minimum_gap_between_cuts_ms: 2000
protect_sentence_endings: true
silence_noise_floor_db: -35.0

ingest_stable_seconds: 2.0
ingest_poll_seconds: 1.0
ingest_max_file_gb: 64.0
worker_claim_timeout_minutes: 240
